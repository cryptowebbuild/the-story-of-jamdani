                  {/* Submit Button */}
                  <button 
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-2"
                  >
                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                    </svg>
                    <span>১-ক্লিকে হোয়াটসঅ্যাপে বুকিং সম্পন্ন করুন</span>
                  </button>

                  <p className="text-[10px] text-center text-rose-300/60">
                    * আপনার দেওয়া তথ্য নিয়ে সরাসরি "জ"-এর অফিশিয়াল হোয়াটসঅ্যাপ ওপেন হবে।
                  </p>

                </form>

              </div>
            </div>
          )}

          {/* 10. HIGH RESOLUTION IMAGE ZOOM LIGHTBOX */}
          {zoomImage && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fade-in"
              onClick={() => setZoomImage(null)}
            >
              <div className="relative max-w-4xl max-h-[90vh] overflow-hidden rounded-2xl border border-gold-500/40 bg-royal-950">
                <button 
                  onClick={() => setZoomImage(null)}
                  className="absolute top-4 right-4 text-white p-2 rounded-full bg-royal-950/80 border border-gold-500/30 hover:bg-gold-500 hover:text-royal-950 transition z-10"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
                <img 
                  src={zoomImage} 
                  alt="জ - খাঁটি ঢাকাই জামদানি ক্লোজ-আপ ভিউ" 
                  className="w-full h-auto max-h-[85vh] object-contain"
                />
              </div>
            </div>
          )}

          {/* 11. MOBILE BOTTOM FLOATING ACTION BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-royal-950/95 backdrop-blur-md border-t border-gold-500/30 p-2.5 flex items-center gap-2">
            <a 
              href={`tel:${BRAND_PHONE}`}
              className="flex-1 py-2.5 rounded-xl bg-royal-900 border border-gold-500/40 text-gold-300 font-bold text-xs flex items-center justify-center gap-1.5"
            >
              <svg className="w-4 h-4 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span>হটলাইনে কল</span>
            </a>

            <a 
              href={`https://wa.me/${WHATSAPP_NUM}`}
              target="_blank"
              rel="noopener noreferrer"
              className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md"
            >
              <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
              </svg>
              <span>হোয়াটসঅ্যাপ চ্যাট</span>
            </a>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
